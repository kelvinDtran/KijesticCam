name: Release

# Pushing a tag like v1.0.0 builds an unsigned Windows installer and attaches it
# to a DRAFT GitHub Release for review. Run manually to get the installer as a
# workflow artifact only (no release is created).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Build unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter 'KijesticCam-Setup-*.exe' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KijesticCam-windows
          path: |
            dist/KijesticCam-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "KijesticCam $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/KijesticCam-Setup-*.exe dist/SHA256SUMS.txt --clobber
